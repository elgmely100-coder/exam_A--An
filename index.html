
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#159be8">

    <title>Ready, Champion?</title>

    <link rel="stylesheet" href="css.css">
</head>

<body>

    <main class="welcome-page">

        <section class="welcome-card">

            <div class="welcome-content">


                <p class="subtitle">
                    Are you ready for the English Grammar Exam?
                </p>

                <form id="startForm">

                    <label for="studentName">
                        Enter your full name:
                    </label>

                    <input
                        type="text"
                        id="studentName"
                        placeholder="Ibrahiem Mohamed Abdelahdy"
                        maxlength="60"
                        autocomplete="name"
                        required
                    >

                    <p id="errorMessage" class="error-message"></p>

                    <button type="submit" class="start-button">
                        <span>▶</span>
                        Start Exam
                    </button>

                </form>

                <p class="bottom-note">
                    Believe in yourself. You can do it! ⭐
                </p>

            </div>

        </section>

    </main>

    <script src="js.js"></script>

</body>
</html>
